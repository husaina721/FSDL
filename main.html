<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RDS CRUD Example</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #2c003e, #3d0066); /* Dark purple gradient */
      padding: 20px;
      color: white;
    }
    h1 { 
      text-align: center; 
      color: #ff9a9e; /* Soft pink for contrast */
    }
    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background: #1a001f; /* Very dark purple for table background */
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }
    th, td {
      border: 1px solid #555;
      padding: 10px;
      text-align: center;
    }
    th { 
      background: #4b0082; /* Indigo header */
      color: #ffdfdf;
    }
    form {
      text-align: center;
      margin-bottom: 20px;
    }
    input, select {
      padding: 8px;
      margin: 5px;
      border: none;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background: #8a2be2; /* Bright purple button */
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { 
      background: #a64dff; 
    }
  </style>
</head>
<body>
  <h1>User Management</h1>

  <form id="userForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="number" id="age" placeholder="Age" required>
    <select id="gender" required>
      <option value="">Select Gender</option>
      <option value="male">👨 Male</option>
      <option value="female">👩 Female</option>
    </select>
    <button type="submit">Add User</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <script>
    const API_URL = "http://127.0.0.1:5000";

    async function fetchUsers() {
      const res = await fetch(`${API_URL}/read`);
      const users = await res.json();
      const table = document.getElementById("userTable");
      table.innerHTML = "";
      users.forEach(user => {
        const row = `<tr>
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.age}</td>
          <td>${user.gender === "male" ? "👨 Male" : "👩 Female"}</td>
          <td>
            <button onclick="deleteUser('${user.name}')">Delete</button>
          </td>
        </tr>`;
        table.innerHTML += row;
      });
    }

    async function addUser(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const age = document.getElementById("age").value;
      const gender = document.getElementById("gender").value;

      await fetch(`${API_URL}/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, age, gender })
      });

      document.getElementById("userForm").reset();
      fetchUsers();
    }

    async function deleteUser(name) {
      await fetch(`${API_URL}/delete`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      fetchUsers();
    }

    document.getElementById("userForm").addEventListener("submit", addUser);
    fetchUsers();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Student Form</title>
<link rel="stylesheet" href="style.css">

<style>
body{
    font-family: Arial;
    background:hsl(154, 44%, 56%);
}

.form-box{
    width:350px;
    margin:80px auto;
    background:rgb(201, 220, 202);
    padding:20px;
    border-radius:6px;
}

input{
    width:100%;
    padding:8px;
    margin-top:10px;
}

button{
    margin-top:15px;
    width:100%;
    padding:10px;
}

.error{
    color:red;
    font-size:12px;
}
</style>

</head>

<body>

<div class="form-box">

<h3>Student Registration</h3>

<form onsubmit="return validateForm()">

<input type="text" id="name" placeholder="Student Name">
<div id="nameErr" class="error"></div>

<input type="text" id="prn" placeholder="PRN Number">
<div id="PRNErr" class="error"></div>

<input type="text" id="contact" placeholder="Contact Number">
<div id="contactErr" class="error"></div>

<input type="email" id="email" placeholder="Email">
<div id="emailErr" class="error"></div>

<input type="password" id="password" placeholder="Password">
<div id="passErr" class="error"></div>

<button type="submit">Submit</button>

</form>

</div>

<!-- JS file attached here -->
<script src="script.js"></script>

</body>
</html>
